[project]
name = "agentx-agentbeats-sol"
version = "0.1.0"
description = "τ²-Bench purple agent using Python + LangGraph for AgentBeats"
requires-python = ">=3.13"
dependencies = [
    "a2a-sdk[http-server]>=0.3.20",
    "langchain>=0.3",
    "langchain-openai>=0.3",
    "langgraph>=0.3",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.24", "httpx>=0.28.1"]
anthropic = ["langchain-anthropic>=0.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "ruff>=0.15.8",
]
